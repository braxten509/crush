name: lint
on:
  push:
    branches: [main, "merge/**"]
  pull_request:

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    uses: charmbracelet/meta/.github/workflows/lint.yml@main
    with:
      os: ${{ github.repository == 'charmbracelet/crush' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest"]' }}
      golangci_path: .golangci.yml
      golangci_version: v2.13.1
      timeout: 10m
