[package]
name = "crush-desktop"
version = "0.1.0"
edition = "2021"
description = "Crush Desktop: the desktop app for Crush"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
