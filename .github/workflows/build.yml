name: build
on:
  push:
    branches: [main, "merge/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.repository == 'charmbracelet/crush' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - name: Verify Linux watcher shutdown
        if: runner.os == 'Linux'
        run: go test -count=20 -run 'Test(KeeperReleasesNotificationWhenWatcherExitsBeforeReply|LeftoverProcessWritesAfterWatcherExits)$' ./internal/filechange
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
      - run: go test -failfast ./...
      - run: go build -race ./...
      - run: go test -race -failfast ./...
