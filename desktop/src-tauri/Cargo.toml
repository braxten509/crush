[package]
name = "crush-desktop"
version = "0.1.0"
edition = "2021"
description = "Crush Desktop's helper: the engine connections, files, terminals and settings behind the Electron windows"

[[bin]]
name = "crush-desktop-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engine client and desktop services (desktop-design 1.2). Each version is
# the one Cargo.lock held when the app was built on Tauri.
tokio = { version = "1.53.3", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "fs"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
uuid = { version = "1.28.0", features = ["v4"] }
dirs = "7.0.0"
base64 = "0.22.1"
# Phases 5 and 6 (desktop-design-5-6 7.1, scaffold S5), each pinned exactly.
portable-pty = "=0.9.0"
libc = "0.2"

[profile.release]
# Symbol names and line tables stay, so a crash report names where it happened (2.28).
strip = false
debug = "line-tables-only"
